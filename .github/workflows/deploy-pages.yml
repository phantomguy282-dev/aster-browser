name: Deploy verified Aster website
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing public release tag matching package.json (for example v3.0.0)
        required: true
        type: string
      installer_sha256:
        description: Independently verified SHA-256 of the public Windows installer
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: aster-pages
  cancel-in-progress: false
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Verify public installer and prepare small static site
        env:
          ASTER_RELEASE_REPOSITORY: ${{ github.repository }}
          ASTER_RELEASE_TAG: ${{ inputs.release_tag }}
          ASTER_RELEASE_SHA256: ${{ inputs.installer_sha256 }}
        run: node scripts/prepare-public-site.cjs
      - name: Upload verified static site (installer stays on Releases)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/public-site
  deploy:
    needs: verify-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish via the official Pages deployment action
        id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify public HTTPS page and release metadata
        env:
          SITE_URL: ${{ steps.publish.outputs.page_url }}
        shell: bash
        run: |
          test "${SITE_URL#https://}" != "$SITE_URL"
          curl --fail --retry 5 --retry-delay 10 --proto '=https' "$SITE_URL" > /dev/null
          curl --fail --retry 5 --retry-delay 10 --proto '=https' "${SITE_URL%/}/download.html" > /dev/null
          curl --fail --retry 5 --retry-delay 10 --proto '=https' "${SITE_URL%/}/release.json"

